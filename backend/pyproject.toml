# Owner: Workstream C (Satya). Backend API for the analyst UI.
#
# This package sits on top of the main `argus-soc` package (graph tools library, agents'
# learning service, settings, tenant registry), which is installed from the repo root first:
#
#     pip install -e .            # repo root: argus-soc
#     pip install -e "backend[dev]"
#
# argus-soc is not listed under `dependencies` because it is not on PyPI; it is always
# installed from this same repo.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-soc-backend"
version = "0.1.0"
description = "FastAPI backend for the Argus SOC analyst UI (Graph Hacks 2026)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
argus-backend = "argus_backend.api_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "../src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's way of declaring dependencies and query parameters.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["argus_backend", "argus_soc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests run without installing either package.
pythonpath = ["src", "../src", "tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
