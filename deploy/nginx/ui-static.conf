# Inside the ui container: serve the built single-page app. Unknown paths fall back to
# index.html so client-side routes like /t/acme/cases/31 load on refresh.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
