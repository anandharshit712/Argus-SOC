# Shared by the local and OCI front proxies. Docker's DNS resolves service names at request
# time, so nginx starts even if the ui or api container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location / {
    set $ui_upstream http://ui:80;
    proxy_pass $ui_upstream;
    proxy_set_header Host $host;
}
