# Live demo harness (Workstream A). Overlay on the main compose; adds the attackable targets,
# the log shipper and the attack-bot to the same project and soc-net network.
#
#   # start the core stack first (FalkorDB, Talos, ingestor, agents, API, UI):
#   docker compose --profile app up -d
#   # then the demo harness:
#   docker compose -f docker-compose.yml -f demo/docker-compose.demo.yml --profile demo up -d
#
# Only web_shop is published (127.0.0.1:8080 locally; on the cloud VM nginx serves it at
# https://SHOP_DOMAIN via docker-compose.public-shop.yml). ssh_target and the bot stay internal.
# No change to Talos or to Workstream B's docker-compose.yml / nginx.
#
# Every live attack lands in tenant GLOBEX: the shop logs as gx-web-01 and the SSH target is
# gx-jump-01, both Globex hosts (data/inventory). Acme is shown by the scenario replays only.

services:
  web_shop:
    profiles: [demo]
    build: { context: ./demo/web_shop }
    restart: unless-stopped
    environment:
      DEMO_WEB_HOST: gx-web-01         # a Globex host in B's inventory seed (data/inventory)
      DEMO_ACCESS_LOG: /var/log/web_shop/access.jsonl
      DEMO_TRUSTED_PROXY: attack_bot   # X-Forwarded-For trusted only from the bot (resolved by DNS)
      DEMO_VALID_ACCOUNT: "${DEMO_VALID_ACCOUNT:-demo@shop.example}"
      DEMO_VALID_PASSWORD: "${DEMO_VALID_PASSWORD:-correct-horse-battery-staple}"
      DEMO_POOL_PASSWORD: "${DEMO_POOL_PASSWORD:-}"   # pool####@shop.example login on a pass run
      DEMO_ATTACK_BOT_URL: http://attack_bot:8000     # the shop page's "Launch" buttons proxy here
      DEMO_ARGUS_UI_URL: "${DEMO_ARGUS_UI_URL:-}"     # optional: link to Argus from the shop page
    volumes:
      - web-logs:/var/log/web_shop
    ports:
      - "127.0.0.1:8080:8000"
    networks: [soc-net]

  ssh_target:
    profiles: [demo]
    build:
      context: ./demo/ssh_target
      args:
        SSH_TARGET_PASSWORD: "${SSH_TARGET_PASSWORD:-correct-horse-battery-staple-ssh}"
        DEMO_SSH_POOL_PASSWORD: "${DEMO_SSH_POOL_PASSWORD:-change-me-ssh-pool}"  # ops### pool login
        DEMO_SSH_POOL_SIZE: "${DEMO_SSH_POOL_SIZE:-300}"
    restart: unless-stopped
    hostname: gx-jump-01               # the host name in each sshd log line (a Globex host)
    volumes:
      - ssh-logs:/var/log
    networks: [soc-net]

  shipper:
    profiles: [demo]
    # ponytail: reuse the pinned Talos image so the shipper uses Talos's OWN parsers. Same
    # Dockerfile+context as the talos service, so this is a fully cached rebuild, not a new image.
    build: { context: ., dockerfile: deploy/talos/Dockerfile }
    restart: unless-stopped
    # sshd's auth.log is root:adm 0640; the Talos image runs as an unprivileged user that cannot
    # read it. The shipper only reads mounted log files, so run it as root.
    user: "0:0"
    command: ["python", "/app/ship.py"]
    environment:
      TALOS_URL: http://talos:8000
      DEMO_WEB_LOG: /var/log/web_shop/access.jsonl
      DEMO_SSH_LOG: /var/log/ssh_target/auth.log
    volumes:
      - ./demo/shipper/ship.py:/app/ship.py:ro
      - web-logs:/var/log/web_shop:ro
      - ssh-logs:/var/log/ssh_target:ro
    # No depends_on talos: it lives in the main compose's `app` profile, so the demo profile
    # stays self-consistent. ship.py polls Talos /healthz before shipping.
    networks: [soc-net]

  attack_bot:
    profiles: [demo]
    build: { context: ./demo/attack_bot }
    restart: unless-stopped
    environment:
      DEMO_SHOP_URL: http://web_shop:8000
      TALOS_URL: http://talos:8000
      DEMO_SSH_HOST: ssh_target
      DEMO_SOAK: "${DEMO_SOAK:-0}"     # set DEMO_SOAK=1 for the always-running chaos loop at boot
      # pass/fail v2 (ATTACK_BOT_PASS_FAIL_DESIGN.md). Pool passwords must match web_shop/ssh_target.
      DEMO_PASS_RATIO: "${DEMO_PASS_RATIO:-0.3}"
      DEMO_BAG_SIZE: "${DEMO_BAG_SIZE:-10}"
      DEMO_POOL_PASSWORD: "${DEMO_POOL_PASSWORD:-}"
      DEMO_WEB_POOL_SIZE: "${DEMO_WEB_POOL_SIZE:-500}"
      DEMO_SSH_POOL_PASSWORD: "${DEMO_SSH_POOL_PASSWORD:-}"
      DEMO_SSH_POOL_SIZE: "${DEMO_SSH_POOL_SIZE:-300}"
      DEMO_SOAK_INTERVAL_MIN: "${DEMO_SOAK_INTERVAL_MIN:-45}"
      DEMO_SOAK_INTERVAL_MAX: "${DEMO_SOAK_INTERVAL_MAX:-180}"
      DEMO_SOAK_PARALLEL: "${DEMO_SOAK_PARALLEL:-0}"   # 1 = auth, injection and ssh attackers overlap
      # Backlog pause (§9a): count Cases Awaiting approval straight off FalkorDB (soc-net, no login).
      DEMO_MAX_PENDING: "${DEMO_MAX_PENDING:-20}"
      DEMO_TENANT: "${DEMO_TENANT:-globex}"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      - "127.0.0.1:8090:8000"          # POST /launch?attack=sqli ; GET /selfcheck
    depends_on:
      - web_shop
      - ssh_target
    networks: [soc-net]

volumes:
  web-logs:
  ssh-logs:
